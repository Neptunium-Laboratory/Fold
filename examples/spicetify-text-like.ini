; Example FOLD colour file in Spicetify's color.ini format.
; Approximates a dark, green-accent, terminal-style theme.
; Use it with:   fold --theme examples/spicetify-text-like.ini
;           or:  FOLD_THEME=examples/spicetify-text-like.ini fold

[Base]
main               = 101010
text               = ffffff
subtext            = a0a0a0
sidebar            = 101010
player             = 101010
card               = 1c1c1c
shadow             = 000000
selected-row       = ffffff
button             = 1ed760
button-active      = 1ed760
notification       = 1ed760
notification-error = e22134
